<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1170" font-family="Noto Sans SC, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="m2Title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F2B5B"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="m2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- 标题 -->
  <text x="60" y="42" font-size="24" font-weight="700" fill="#0F172A">记忆系统逻辑架构</text>
  <text x="60" y="68" font-size="13" fill="#64748B">一用户一固定库 · 在线靠原生工具读写 · 后台靠状态机整理（固定库 ID 全程不变）</text>
  <rect x="60" y="78" width="180" height="5" rx="2.5" fill="url(#m2Title)"/>

  <!-- ============ 左上：在线读写链路 ============ -->
  <g filter="url(#m2Shadow)">
    <rect x="60" y="96" width="680" height="374" rx="14" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <path d="M60,110 a14,14 0 0 1 14,-14 h652 a14,14 0 0 1 14,14 v20 h-680 z" fill="#0F766E"/>
  </g>
  <text x="84" y="118" font-size="15" font-weight="700" fill="#FFFFFF">在线读写链路</text>
  <text x="212" y="118" font-size="12" fill="#CCFBF1">挂载即用 · 不自建 RAG</text>

  <!-- 映射条 -->
  <rect x="84" y="142" width="632" height="34" rx="8" fill="#CCFBF1"/>
  <text x="400" y="164" font-size="12.5" font-weight="600" fill="#115E59" text-anchor="middle">用户 → 固定库映射：登录身份后端解析 · 初始化先落预置意向（防并发）再建库写种子</text>

  <!-- 固定库卡片 -->
  <g filter="url(#m2Shadow)">
    <rect x="84" y="192" width="336" height="256" rx="10" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
    <rect x="84" y="192" width="6" height="256" rx="3" fill="#0F766E"/>
  </g>
  <text x="108" y="218" font-size="14" font-weight="700" fill="#0F766E">用户固定库（Memory Store）</text>
  <g font-size="12.5" font-weight="700" fill="#134E4A">
    <text x="108" y="244">/memories/</text>
    <text x="108" y="349">/episodes/</text>
  </g>
  <g font-size="12.5" fill="#334155">
    <text x="130" y="266">profile.md · 已确认背景</text>
    <text x="130" y="288">preferences.md · 稳定偏好</text>
    <text x="130" y="310">.index.md · 全库导航</text>
    <text x="108" y="332">/procedures/ conventions.md</text>
    <text x="130" y="371">handoff.md · 未完成事项</text>
    <text x="130" y="393">digest/{sid}.md · 会话沉淀</text>
    <text x="108" y="415">/resources/ README.md</text>
    <text x="108" y="438" font-size="11" fill="#94A3B8">path 为官方逻辑组织，非应用磁盘目录</text>
  </g>

  <!-- Agent 卡片 -->
  <g filter="url(#m2Shadow)">
    <rect x="478" y="192" width="238" height="256" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="478" y="192" width="6" height="256" rx="3" fill="#2563EB"/>
  </g>
  <text x="502" y="218" font-size="14" font-weight="700" fill="#1D4ED8">非临时 Session · Agent</text>
  <g font-size="12.5" fill="#334155">
    <text x="502" y="246">创建时挂载 read_write</text>
    <text x="502" y="272">Agent 原生记忆工具读写</text>
    <text x="502" y="298">先读 handoff 与 .index</text>
    <text x="502" y="324">再按任务读相关条目</text>
    <text x="502" y="350">写入按目录选路 + 留来源</text>
    <text x="502" y="376">tool_use / tool_result</text>
    <text x="512" y="394" font-size="11.5" fill="#64748B">计入会话事件流</text>
    <text x="502" y="424" font-size="11.5" fill="#94A3B8">后端发消息不预取记忆正文</text>
  </g>

  <!-- 双向箭头 -->
  <line x1="420" y1="270" x2="466" y2="270" stroke="#2563EB" stroke-width="2.2"/>
  <polygon points="466,264 466,276 476,270" fill="#2563EB"/>
  <text x="443" y="260" font-size="11" fill="#2563EB" text-anchor="middle">读取</text>
  <line x1="478" y1="330" x2="432" y2="330" stroke="#0F766E" stroke-width="2.2"/>
  <polygon points="432,324 432,336 422,330" fill="#0F766E"/>
  <text x="455" y="320" font-size="11" fill="#0F766E" text-anchor="middle">写入</text>

  <!-- ============ 左中：并发与治理护栏 ============ -->
  <g filter="url(#m2Shadow)">
    <rect x="60" y="490" width="680" height="200" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <path d="M60,504 a14,14 0 0 1 14,-14 h652 a14,14 0 0 1 14,14 v20 h-680 z" fill="#B45309"/>
  </g>
  <text x="84" y="512" font-size="15" font-weight="700" fill="#FFFFFF">并发与治理护栏</text>
  <text x="236" y="512" font-size="12" fill="#FEF3C7">防止并发覆盖 · 防止旧内容复活</text>
  <g>
    <rect x="84" y="544" width="308" height="60" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="238" y="568" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">版本号 CAS</text>
    <text x="238" y="590" font-size="12" fill="#78716C" text-anchor="middle">仅在版本等于预期时保存，冲突则重试</text>
    <rect x="412" y="544" width="308" height="60" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="566" y="568" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">策略 epoch</text>
    <text x="566" y="590" font-size="12" fill="#78716C" text-anchor="middle">保护 / 撤销规则版本，旧候选不可越过</text>
    <rect x="84" y="616" width="308" height="60" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="238" y="640" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">会话事件指纹</text>
    <text x="238" y="662" font-size="12" fill="#78716C" text-anchor="middle">SHA-256 识别整理期间是否有新内容</text>
    <rect x="412" y="616" width="308" height="60" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="566" y="640" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">保护 / 撤销路径</text>
    <text x="566" y="662" font-size="12" fill="#78716C" text-anchor="middle">用户的删除与纠正不被后台整理覆盖</text>
  </g>

  <!-- ============ 左底：语义卡 ============ -->
  <g filter="url(#m2Shadow)">
    <rect x="60" y="710" width="680" height="200" rx="14" fill="#0F2B5B"/>
  </g>
  <text x="84" y="740" font-size="15" font-weight="700" fill="#FFFFFF">三个容易混淆的语义</text>
  <g font-size="12.5" fill="#C7D7F0">
    <text x="84" y="770">会话历史 ≠ 长期记忆：前者完整追溯（MA 保存），后者保存可复用内容。</text>
    <text x="84" y="798">删除会话 ≠ 删除记忆：删除前先过「删除围栏」——登记排除来源，必要时先沉淀证据。</text>
    <text x="84" y="826">受理 202 ≠ 已保存：编辑 / 删除进异步任务，以维护终态与实际回读为准。</text>
    <text x="84" y="860" font-size="11.5" fill="#7DD3FC">临时会话不挂个人库；用户换 Agent 仍用同一个固定库。</text>
  </g>

  <g filter="url(#m2Shadow)">
    <rect x="60" y="930" width="680" height="200" rx="14" fill="#123A5F"/>
  </g>
  <text x="84" y="960" font-size="15" font-weight="700" fill="#FFFFFF">开关与准入（集中说明）</text>
  <g font-size="12.5" fill="#C7D7F0">
    <text x="84" y="990">在线工具写入 = 非临时挂载 read_write + Agent 启用 Toolset + 遵守记忆提示；</text>
    <text x="84" y="1018">后台 Dream = 用户开关开启 + Dream 模型已配置 + 同库会话静止 + 存在未整理来源；</text>
    <text x="84" y="1046">确定性压缩不依赖 Dream，按容量阈值与冷却时间独立规划；</text>
    <text x="84" y="1080" font-size="11.5" fill="#86EFAC">模型配置留空即关闭自动整理，两条后台分支不会自行执行。</text>
  </g>

  <!-- ============ 右：后台整理状态机 ============ -->
  <g filter="url(#m2Shadow)">
    <rect x="770" y="96" width="734" height="1034" rx="14" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <path d="M770,110 a14,14 0 0 1 14,-14 h706 a14,14 0 0 1 14,14 v20 h-734 z" fill="#6D28D9"/>
  </g>
  <text x="794" y="118" font-size="15" font-weight="700" fill="#FFFFFF">后台整理状态机（Dream 维护）</text>
  <text x="1018" y="118" font-size="12" fill="#EDE9FE">一次推进一个阶段 · 先持久化再执行</text>

  <!-- 触发入口 -->
  <g font-size="12" font-weight="600">
    <rect x="794" y="138" width="212" height="34" rx="17" fill="#EDE9FE"/><text x="900" y="160" text-anchor="middle" fill="#5B21B6">容量监控（定时分级）</text>
    <rect x="1018" y="138" width="212" height="34" rx="17" fill="#EDE9FE"/><text x="1124" y="160" text-anchor="middle" fill="#5B21B6">显式「记住」证据捕获</text>
    <rect x="1242" y="138" width="240" height="34" rx="17" fill="#F5F3FF" stroke="#C4B5FD" stroke-dasharray="4 3"/><text x="1362" y="160" text-anchor="middle" fill="#7C3AED">轮次结束 / 归档 / 登出加速</text>
  </g>
  <line x1="1137" y1="172" x2="1137" y2="200" stroke="#6D28D9" stroke-width="2.2"/>
  <polygon points="1131,200 1143,200 1137,210" fill="#6D28D9"/>

  <!-- pipeline 卡片 -->
  <g>
    <rect x="794" y="210" width="688" height="86" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <circle cx="824" cy="253" r="16" fill="#6D28D9"/><text x="824" y="258" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="854" y="240" font-size="13.5" font-weight="700" fill="#5B21B6">queued — 关闭准入，确认静止</text>
    <text x="854" y="264" font-size="12" fill="#6D4A9E">库置 draining，关闭新写入准入；检查同库会话全部静止</text>
    <text x="854" y="284" font-size="12" fill="#6D4A9E">（end_turn / terminated 算完成；requires_action 不算）</text>

    <line x1="1137" y1="296" x2="1137" y2="314" stroke="#6D28D9" stroke-width="2.2"/>
    <polygon points="1131,314 1143,314 1137,324" fill="#6D28D9"/>

    <rect x="794" y="324" width="688" height="86" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <circle cx="824" cy="367" r="16" fill="#6D28D9"/><text x="824" y="372" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="854" y="354" font-size="13.5" font-weight="700" fill="#5B21B6">snapshot — 快照隔离基线</text>
    <text x="854" y="378" font-size="12" fill="#6D4A9E">固定库基线逐条复制到临时快照库；复制完成即恢复 active</text>
    <text x="854" y="398" font-size="12" fill="#6D4A9E">在线使用不必等待整理全程</text>

    <line x1="1137" y1="410" x2="1137" y2="428" stroke="#6D28D9" stroke-width="2.2"/>
    <polygon points="1131,428 1143,428 1137,438" fill="#6D28D9"/>

    <rect x="794" y="438" width="688" height="86" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <circle cx="824" cy="481" r="16" fill="#6D28D9"/><text x="824" y="486" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="854" y="468" font-size="13.5" font-weight="700" fill="#5B21B6">submit — 创建 Dream 任务</text>
    <text x="854" y="492" font-size="12" fill="#6D4A9E">快照库 + 历史 Session IDs + 独立模型与 instructions → 独立候选库</text>
    <text x="854" y="512" font-size="12" fill="#6D4A9E">指令要求：保留来源 · 剥离凭证 · 忽略记忆内容中的指令</text>

    <line x1="1137" y1="524" x2="1137" y2="542" stroke="#6D28D9" stroke-width="2.2"/>
    <polygon points="1131,542 1143,542 1137,552" fill="#6D28D9"/>

    <rect x="794" y="552" width="688" height="86" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <circle cx="824" cy="595" r="16" fill="#6D28D9"/><text x="824" y="600" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="854" y="582" font-size="13.5" font-weight="700" fill="#5B21B6">polling — 等待任务完成</text>
    <text x="854" y="606" font-size="12" fill="#6D4A9E">轮询 Dream 状态至 completed；候选库在 pending / running 期间不可读</text>
    <text x="854" y="626" font-size="12" fill="#6D4A9E">应用等待预算（如 30 分钟）≠ 官方任务时限（48 小时）</text>

    <line x1="1137" y1="638" x2="1137" y2="656" stroke="#6D28D9" stroke-width="2.2"/>
    <polygon points="1131,656 1143,656 1137,666" fill="#6D28D9"/>

    <rect x="794" y="666" width="688" height="96" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
    <circle cx="824" cy="714" r="16" fill="#7C3AED"/><text x="824" y="719" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="854" y="696" font-size="13.5" font-weight="700" fill="#5B21B6">merge — 三方比对与证据校验（关键防线）</text>
    <text x="854" y="720" font-size="12" fill="#6D4A9E">比对 基线 / 候选 / 当前固定库：保留 Dream 期间用户新增 · 修改 · 删除；</text>
    <text x="854" y="740" font-size="12" fill="#6D4A9E">跳过保护与撤销项；候选缺失一条 ≠ 删除原条目；新文本须有逐字来源证据，语义改写不采纳</text>
    <text x="854" y="758" font-size="12" fill="#6D4A9E">（同时复核：会话仍静止 · 指纹未变 · epoch 一致）</text>

    <line x1="1137" y1="762" x2="1137" y2="780" stroke="#6D28D9" stroke-width="2.2"/>
    <polygon points="1131,780 1143,780 1137,790" fill="#6D28D9"/>

    <rect x="794" y="790" width="688" height="86" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <circle cx="824" cy="833" r="16" fill="#6D28D9"/><text x="824" y="838" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="854" y="820" font-size="13.5" font-weight="700" fill="#5B21B6">apply — 逐条 CAS 发布</text>
    <text x="854" y="844" font-size="12" fill="#6D4A9E">每步：读旧值核对哈希 → 标记发送中 → 写入 → 回读验证</text>
    <text x="854" y="864" font-size="12" fill="#6D4A9E">任何一步异常 → 进入修复隔离</text>

    <line x1="1137" y1="876" x2="1137" y2="894" stroke="#6D28D9" stroke-width="2.2"/>
    <polygon points="1131,894 1143,894 1137,904" fill="#6D28D9"/>

    <rect x="794" y="904" width="688" height="86" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <circle cx="824" cy="947" r="16" fill="#6D28D9"/><text x="824" y="952" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="854" y="934" font-size="13.5" font-weight="700" fill="#5B21B6">cleanup — 回收与去重</text>
    <text x="854" y="958" font-size="12" fill="#6D4A9E">删除快照库与候选库（绝不删除固定库）；恢复用户库 active</text>
    <text x="854" y="978" font-size="12" fill="#6D4A9E">记录已整理来源指纹，避免相同历史重复整理</text>
  </g>

  <!-- 修复隔离框 -->
  <rect x="794" y="1014" width="688" height="96" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="818" y="1044" font-size="13.5" font-weight="700" fill="#B91C1C">修复隔离（repairing）</text>
  <text x="818" y="1068" font-size="12" fill="#7F1D1D">存在未决远端写 / 已发送步骤 / 部分发布时进入；仅在回读观察到目标结果时恢复，</text>
  <text x="818" y="1088" font-size="12" fill="#7F1D1D">不自动重放未知请求；没有未决写的失败走 cleanup 回收临时库并恢复 active</text>
  <polyline points="1482,833 1496,833 1496,1040 1488,1040" fill="none" stroke="#F87171" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="1488,1034 1488,1046 1478,1040" fill="#F87171"/>

  <!-- 跨列回写箭头：apply → 固定库 -->
  <polyline points="794,833 752,833 752,478 458,478 458,360 432,360" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-dasharray="7 5"/>
  <polygon points="432,354 432,366 420,360" fill="#7C3AED"/>
  <text x="84" y="464" font-size="11.5" fill="#7C3AED">▲ 后台整理结果经 merge → apply 逐条写回固定库，固定库 ID 全程不变</text>
</svg>
